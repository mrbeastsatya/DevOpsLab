<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:400px;
            padding:25px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        #result{
            font-size:20px;
            font-weight:bold;
            color:#0d6efd;
            margin-top:20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 class="text-center mb-4">Temperature Converter</h2>

    <!-- Conversion Option -->
    <div class="mb-3">
        <label class="form-label">Select Conversion</label>
        <select id="conversion" class="form-select">
            <option value="ctof">Celsius (°C) → Fahrenheit (°F)</option>
            <option value="ftoc">Fahrenheit (°F) → Celsius (°C)</option>
        </select>
    </div>

    <!-- Temperature Input -->
    <div class="mb-3">
        <label class="form-label">Enter Temperature</label>
        <input type="number" id="temperature" class="form-control" placeholder="Enter Temperature">
    </div>

    <!-- Button -->
    <div class="d-grid">
        <button class="btn btn-primary" onclick="convertTemperature()">
            Convert
        </button>
    </div>

    <!-- Result -->
    <div id="result" class="text-center"></div>

</div>

<script>

function convertTemperature(){

    let temp = parseFloat(document.getElementById("temperature").value);
    let type = document.getElementById("conversion").value;
    let result = document.getElementById("result");

    if(isNaN(temp)){
        result.innerHTML = "Please enter a valid temperature.";
        return;
    }

    if(type === "ctof"){
        let fahrenheit = (temp * 9/5) + 32;
        result.innerHTML = `${temp} °C = ${fahrenheit.toFixed(2)} °F`;
    }
    else{
        let celsius = (temp - 32) * 5/9;
        result.innerHTML = `${temp} °F = ${celsius.toFixed(2)} °C`;
    }

}

</script>

</body>
</html>
