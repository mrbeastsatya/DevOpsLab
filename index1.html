<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Calculator</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .calculator {
      max-width: 350px;
    }
    .display {
      font-size: 2rem;
      height: 70px;
    }
  </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="calculator card shadow-lg p-3 rounded-4 bg-dark text-white">
    <div class="card-body p-2">
      <!-- Screen Display -->
      <input type="text" id="display" class="form-control text-end mb-3 display bg-secondary text-white border-0 fw-bold rounded-3" readonly value="0">
      
      <!-- Keypad Grid -->
      <div class="row g-2">
        <div class="col-3"><button class="btn btn-warning w-100 py-3 fw-bold rounded-3" onclick="clearDisplay()">C</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('/')">÷</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('*')">×</button></div>
        <div class="col-3"><button class="btn btn-danger w-100 py-3 fw-bold rounded-3" onclick="deleteLast()">⌫</button></div>

        <div class="col-3"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('7')">7</button></div>
        <div class="col-3"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('8')">8</button></div>
        <div class="col-3"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('9')">9</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('-')">-</button></div>

        <div class="col-3"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('4')">4</button></div>
        <div class="col-3"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('5')">5</button></div>
        <div class="col-3"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('6')">6</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('+')">+</button></div>

        <div class="col-3"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('1')">1</button></div>
        <div class="col-3"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('2')">2</button></div>
        <div class="col-3"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('3')">3</button></div>
        <div class="col-3" rowspan="2"><button class="btn btn-primary w-100 h-100 py-3 fw-bold rounded-3" onclick="calculateResult()">=</button></div>

        <div class="col-6"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('0')">0</button></div>
        <div class="col-3"><button class="btn btn-outline-light w-100 py-3 fw-bold rounded-3" onclick="appendCharacter('.')">.</button></div>
      </div>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendCharacter(char) {
      if (display.value === '0' && char !== '.') {
        display.value = char;
      } else {
        display.value += char;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      if (display.value.length === 1 || display.value === 'Error') {
        display.value = '0';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calculateResult() {
      try {
        display.value = eval(display.value);
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
